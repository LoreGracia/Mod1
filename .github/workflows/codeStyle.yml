name: Code Style

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  code-style:
    name: clang-format + clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build linter image
        run: make lint-build

      - name: Run linter
        run: make lint-summary